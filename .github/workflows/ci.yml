name: CI

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint source and tests
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build static app
        run: npm run build

      - name: Run tests and tracked-file secret scan
        run: npm test

  browser-smoke:
    name: Browser smoke (WP1.5b pending)
    # TODO(WP1.5b): install pinned Playwright and browsers, add an actual smoke
    # test against the built preview, then enable this job and require its check.
    # A skipped placeholder is not evidence of a passing browser test.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: WP1.5b not implemented
        run: echo 'Browser smoke is not implemented; this job must stay skipped.'
