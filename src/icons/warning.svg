<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <mask id="warning-mask">
      <rect width="16" height="16" fill="white"/>
      <!-- exclamation body cutout -->
      <rect x="7" y="4" width="2" height="5" fill="black"/>
      <!-- exclamation dot cutout -->
      <rect x="7" y="11" width="2" height="2" fill="black"/>
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#warning-mask)">
    <!-- triangle tip -->
    <rect x="7" y="0" width="2" height="2"/>
    <!-- expanding rows -->
    <rect x="5" y="2" width="6" height="2"/>
    <rect x="3" y="4" width="10" height="2"/>
    <rect x="1" y="6" width="14" height="6"/>
    <!-- base -->
    <rect x="0" y="12" width="16" height="2"/>
  </g>
</svg>
